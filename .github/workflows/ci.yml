name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/adrian_zephyr_notes?schema=public
      BACKEND_API_BASE_URL: http://localhost:3001
      VITE_BACKEND_API_BASE_URL: http://localhost:3001
      FRONTEND_ORIGIN: http://localhost:3002
      ADMIN_FRONTEND_ORIGIN: http://localhost:3000
      ADMIN_GITHUB_LOGINS: Adrian-Zephyr-Liao
      GITHUB_OAUTH_CLIENT_ID: ci-placeholder
      GITHUB_OAUTH_CLIENT_SECRET: ci-placeholder
      GITHUB_OAUTH_CALLBACK_URL: http://localhost:3002/api/auth/github/callback
      LLM_BASE_URL: https://api.example.test/v1
      LLM_MODEL: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @adrian-zephyr-notes/server prisma:generate

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build server
        run: pnpm --filter @adrian-zephyr-notes/server build

      - name: Test server HTTP boundaries
        run: >-
          pnpm --filter @adrian-zephyr-notes/server exec vp test run
          --config vitest.e2e.config.ts
          test/article-image-upload-http.e2e-spec.ts
          test/public-article-query-http.e2e-spec.ts

      - name: Build website
        run: pnpm --filter @adrian-zephyr-notes/website build

      - name: Install browser
        run: pnpm --filter @adrian-zephyr-notes/website exec playwright install --with-deps chromium

      - name: Test website in desktop and mobile browsers
        run: pnpm --filter @adrian-zephyr-notes/website test:browser

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-failures
          path: apps/website/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build admin
        run: pnpm --filter @adrian-zephyr-notes/admin build

  deploy-production:
    name: Deploy production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup image builder
        uses: docker/setup-buildx-action@v3

      - name: Configure deployment SSH
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Select affected services
        id: release
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          base=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'cat /srv/adrian-zephyr-notes/.git/az-notes-last-deployed')
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t files < <(git diff --name-only "$base" HEAD)
          services=$(./scripts/select-deploy-services.sh "${files[@]}")
          if [[ "$services" == __full_stack__ || " $services " == *" server "* ]]; then
            echo "Backend/infrastructure changes require a planned release; automatic deployment keeps the running services."
            exit 1
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"

      - name: Build and publish prebuilt images
        if: steps.release.outputs.services != ''
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          RELEASE_SERVICES: ${{ steps.release.outputs.services }}
        run: |
          set -euo pipefail
          read -r -a services <<< "$RELEASE_SERVICES"
          ./scripts/build-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/release" "${services[@]}"
          ./scripts/publish-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/release"

      - name: Smoke test production
        run: |
          set -euo pipefail
          curl --fail --retry 3 --retry-all-errors --silent --show-error https://zephyrai.site/
          curl --fail --retry 3 --retry-all-errors --silent --show-error https://admin.zephyrai.site/
          curl --fail --retry 3 --retry-all-errors --silent --show-error https://zephyrai.site/api/site-config
          curl --fail --retry 3 --retry-all-errors --silent --show-error https://zephyrai.site/api/auth/me
